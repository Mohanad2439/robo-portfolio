<!DOCTYPE html>
<html>
    <head>
        <title>Robo Portfolio</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="style.css" rel="stylesheet">
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Bungee&display=swap');
        </style>
    </head>
<body>
<div id="app">
  <div id="sky"></div>

  <!-- GAME -->
  <div id="game-screen">
    <div id="hud">
      <div class="who">climbing <b id="who-name">Mohanad</b>'s tower</div>
      <div id="rungs"></div>
      <div id="counter"><b id="idx-now">0</b> / <span id="idx-total">0</span></div>
    </div>

    <div id="scene">
      <div id="stage">
        <div class="side-panel left" id="panel-left">
          <div class="proj-name" id="name-left"></div>
          <div class="proj-desc" id="desc-left"></div>
          <div class="proj-links" id="links-left"></div>
        </div>
        <div class="side-panel right" id="panel-right">
          <div class="proj-name" id="name-right"></div>
          <div class="proj-desc" id="desc-right"></div>
          <div class="proj-links" id="links-right"></div>
        </div>

        <div id="track-viewport">
          <div id="track"></div>
        </div>

        <div id="robot-anchor">
          <div id="robot">
            <div class="r-antenna"></div>
            <div class="r-head">
              <div class="r-eye l"></div>
              <div class="r-eye r"></div>
            </div>
            <div class="r-arm l"></div>
            <div class="r-arm r"></div>
            <div class="r-body"></div>
            <div class="r-leg l"></div>
            <div class="r-leg r"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="controls">tap the robot / press <b>SPACE</b> to jump to the next project</div>
  </div>

  <!-- END -->
  <div id="end-screen">
    <div class="card">
      <h1 class="pixel">TOP OF<br>THE TOWER</h1>
      <p class="sub" id="end-summary"></p>
      <button id="restart-btn" class="pixel">CLIMB AGAIN</button>
      <div class="restart-hint">this is a UI demo &mdash; wire it up to a real GitHub username later</div>
    </div>
  </div>
</div>

<script>
(function(){
  const gameScreen = document.getElementById('game-screen');
  const endScreen = document.getElementById('end-screen');
  const robot = document.getElementById('robot');
  const track = document.getElementById('track');
  const stage = document.getElementById('stage');
  const rungsEl = document.getElementById('rungs');
  const idxNow = document.getElementById('idx-now');
  const idxTotal = document.getElementById('idx-total');
  const whoName = document.getElementById('who-name');
  const restartBtn = document.getElementById('restart-btn');
  const endSummary = document.getElementById('end-summary');
  const sky = document.getElementById('sky');

  const panels = {
    left: {
      wrap: document.getElementById('panel-left'),
      name: document.getElementById('name-left'),
      desc: document.getElementById('desc-left'),
      links: document.getElementById('links-left'),
    },
    right: {
      wrap: document.getElementById('panel-right'),
      name: document.getElementById('name-right'),
      desc: document.getElementById('desc-right'),
      links: document.getElementById('links-right'),
    }
  };

  const PALETTE = ['#232a52','#2a2f5c','#232447','#2c2456','#1f2b52','#26264f'];
  const TILE_H = 24;
  const TILE_GAP = 58;
  const TILE_STEP = TILE_H + TILE_GAP;

  let projects = [];
  let index = -1;
  let busy = false;
  let audioCtx = null;

  // -------- starfield --------
  function makeStars(){
    for(let i=0;i<50;i++){
      const s = document.createElement('div');
      s.className = 'star' + (Math.random() < 0.25 ? ' big' : '');
      s.style.left = Math.random()*100 + '%';
      s.style.top = Math.random()*70 + '%';
      s.style.opacity = (0.2 + Math.random()*0.6).toFixed(2);
      sky.appendChild(s);
    }
  }
  makeStars();

  // -------- dummy project data (UI demo, no live GitHub call) --------
  const MY_PROJECTS = [
    { name:'Off-side Store', description:'A football/soccer-themed e-commerce store website, deployed via GitHub Pages. Built as a front-end web project showcasing product browsing for a sports apparel storefront', url:'https://github.com/Mohanad2439/Off-side_Store', demo:'https://example.com/synthwave-player' },
    { name:'Pixel Car Game', description:'A simple 2D car game built in C# using Windows Forms. Features basic car movement controls, collision detection, and score tracking, with a compiled executable available for direct play.', url:'https://github.com/Mohanad2439/Pixel-Car-Game', demo:null },
    { name:'MCPharm', description:'A PHP web application for an online pharmacy, featuring product search and browsing, a shopping cart, and an end-to-end checkout process (delivery details → order confirmation)', url:'https://github.com/Mohanad2439/MC-Pharm.-.', demo:null },
  ]

  // -------- tile track --------
  function buildTiles(){
    track.innerHTML = '';
    track.style.transform = `translateX(-49%) translateY(0px)`;
    projects.forEach((proj, i) => {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.style.background = PALETTE[i % PALETTE.length];
      const num = document.createElement('div');
      num.className = 'tile-num';
      num.textContent = String(i+1).padStart(2,'0');
      tile.appendChild(num);
      track.appendChild(tile);
    });
  }
  function moveTrackTo(i){
    track.style.transform = `translateX(-50%) translateY(${i*TILE_STEP}px)`;
    const tiles = track.children;
    for(let t=0;t<tiles.length;t++){
      tiles[t].classList.toggle('active', t === i);
      tiles[t].classList.toggle('visited', t < i);
    }
  }

  // -------- HUD --------
  function buildRungs(){
    rungsEl.innerHTML = '';
    const max = 24;
    const total = projects.length;
    const showCount = Math.min(total, max);
    for(let i=0;i<showCount;i++){
      const d = document.createElement('div');
      d.className = 'rung';
      d.dataset.i = i;
      rungsEl.appendChild(d);
    }
    idxTotal.textContent = total;
  }
  function updateRungs(){
    const kids = rungsEl.children;
    for(let i=0;i<kids.length;i++){
      kids[i].classList.toggle('done', i < index);
      kids[i].classList.toggle('current', i === index);
    }
    idxNow.textContent = Math.min(index+1, projects.length);
  }

  // -------- particles --------
  function burstDust(){
    for(let i=0;i<8;i++){
      const p = document.createElement('div');
      p.className = 'dust';
      const angle = Math.random()*Math.PI - Math.PI/2 - Math.PI/2;
      const dist = 20 + Math.random()*30;
      p.style.setProperty('--dx', Math.cos(angle)*dist + 'px');
      p.style.setProperty('--dy', Math.abs(Math.sin(angle))*dist*-1 + 'px');
      p.style.animation = 'dustpop 0.5s ease-out forwards';
      stage.appendChild(p);
      setTimeout(()=>p.remove(), 550);
    }
  }

  // -------- render a project onto side panels --------
  function renderProject(i){
    const proj = projects[i];
    const side = (i % 2 === 0) ? 'left' : 'right';
    const other = side === 'left' ? 'right' : 'left';

    // hide both, clear
    panels.left.wrap.classList.remove('show');
    panels.right.wrap.classList.remove('show');

    const p = panels[side];
    p.name.textContent = proj.name;
    p.desc.textContent = proj.description;
    p.links.innerHTML = '';

    const codeLink = document.createElement('a');
    codeLink.href = proj.url; codeLink.target = '_blank'; codeLink.rel = 'noopener';
    codeLink.className = 'link-pill';
    codeLink.textContent = 'Go to Repo';
    p.links.appendChild(codeLink);

    if(proj.demo){
      const demoLink = document.createElement('a');
      demoLink.href = proj.demo; demoLink.target = '_blank'; demoLink.rel = 'noopener';
      demoLink.className = 'link-pill demo';
      demoLink.textContent = 'LIVE DEMO';
      p.links.appendChild(demoLink);
    }


    // stagger the panel reveal slightly after the hop lands
    setTimeout(()=>{ p.wrap.classList.add('show'); }, 260);

    // platform color shift per level
    sky.style.filter = `hue-rotate(${(i*14)%360}deg)`;
  }

  function advance(){
    if(busy) return;
    if(index + 1 >= projects.length){
      finish();
      return;
    }
    busy = true;
    index++;
    robot.classList.remove('jump');
    void robot.offsetWidth; // restart animation
    robot.classList.add('jump');
    moveTrackTo(index);
    burstDust();
    updateRungs();
    setTimeout(()=>{
      renderProject(index);
      busy = false;
    }, 180);
  }

  function finish(){
    panels.left.wrap.classList.remove('show');
    panels.right.wrap.classList.remove('show');
    gameScreen.style.display = 'none';
    endScreen.style.display = 'flex';
    endSummary.textContent = `You climbed through ${projects.length} project${projects.length===1?'':'s'} in ${whoName.textContent}'s tower. Nice work, robot.`;
  }

  function launch(){
    gameScreen.style.display = 'block';
    endScreen.style.display = 'none';
    index = -1;
    sky.style.filter = 'none';
    buildTiles();
    buildRungs();
    updateRungs();
    setTimeout(advance, 300);
  }

  robot.addEventListener('click', advance);
  window.addEventListener('keydown', (e)=>{
    if(e.code === 'Space' || e.code === 'ArrowUp'){
      e.preventDefault();
      advance();
    }
  });
  restartBtn.addEventListener('click', ()=>{
    projects = MY_PROJECTS;
    launch();
  });

  projects=MY_PROJECTS;
  launch();

})();
</script>
</body>
</html>
